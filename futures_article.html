<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>云算盘 · GPU 算力期货资讯</title>
  <style>
    :root{--bg:#0a0a14;--card:#141428;--text:#e2e8f0;--t2:#94a3b8;--border:#2d2d50;--accent:#8b5cf6;--r:12px;--rs:8px}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.8;min-height:100vh}
    body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 80% 50% at 20% 10%,rgba(139,92,246,.1) 0%,transparent 60%),radial-gradient(ellipse 60% 60% at 80% 80%,rgba(99,102,241,.08) 0%,transparent 60%)}
    .container{max-width:800px;margin:0 auto;padding:1.5rem;position:relative;z-index:1}
    .nav{display:flex;gap:.5rem;margin-bottom:1.5rem;flex-wrap:wrap}
    .nav a{display:inline-flex;align-items:center;gap:.3rem;padding:.45rem .85rem;border-radius:var(--rs);text-decoration:none;font-size:.82rem;transition:all .2s}
    .nav-back{background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.3);color:#b4a5f7}
    .nav-back:hover{background:rgba(139,92,246,.25)}
    .nav-list{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.25);color:#34d399}
    .nav-list:hover{background:rgba(16,185,129,.22)}

    article h1{font-size:1.5rem;color:var(--text);margin-bottom:.6rem;line-height:1.4}
    .meta{color:var(--t2);font-size:.82rem;margin-bottom:1.5rem;display:flex;gap:1rem;flex-wrap:wrap;align-items:center}
    .lang-tag{padding:.15rem .5rem;border-radius:4px;font-size:.7rem;font-weight:600}
    .lang-tag.zh{background:rgba(16,185,129,.15);color:#34d399}
    .lang-tag.en{background:rgba(245,158,11,.15);color:#fbbf24}

    section{margin:1.5rem 0}
    section h2{color:#c4b5fd;font-size:1.05rem;margin-bottom:.8rem;padding-bottom:.5rem;border-bottom:1px solid var(--border)}
    section p{color:var(--t2);font-size:.9rem;line-height:2;margin-bottom:.8rem}
    section img{max-width:100%;border-radius:8px;margin:.6rem 0;border:1px solid var(--border)}

    .en-block{background:rgba(255,255,255,.02);border-left:3px solid rgba(139,92,246,.35);border-radius:0 6px 6px 0;padding:1rem 1.2rem;margin:1rem 0}
    .en-block p{color:#94a3b8;font-size:.86rem;line-height:1.9}

    .source-box{background:var(--card);border:1px solid var(--border);border-radius:var(--rs);padding:1.2rem;margin-top:2rem;text-align:center}
    .source-box a{color:var(--accent);text-decoration:none;word-break:break-all}
    .source-box a:hover{text-decoration:underline}
    .btn-read{display:inline-block;padding:.7rem 2rem;background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff!important;border-radius:50px;text-decoration:none;font-weight:600;font-size:.9rem;transition:all .2s}
    .btn-read:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(139,92,246,.4)}

    .error{text-align:center;padding:4rem 1rem;color:var(--t2)}
    .footer{text-align:center;padding:2rem 0 1rem;font-size:.78rem;color:#475569}

    @media(max-width:768px){.container{padding:.75rem}article h1{font-size:1.2rem}}
  </style>
</head>
<body>
<div class="container">
  <div class="nav">
    <a href="futures.html" class="nav-list">&larr; 返回资讯列表</a>
    <a href="home.html" class="nav-back">&larr; 返回首页</a>
  </div>

  <div id="content"></div>
  <div class="footer">云算盘 CloudAbacus · 新闻数据每日自动更新</div>
</div>

<script src="futures_news.js"></script>
<script>
(function(){
  var news=window.GPU_NEWS||[];
  var params=new URLSearchParams(window.location.search);
  var id=parseInt(params.get('id'));
  var el=document.getElementById('content');

  function e(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

  if(isNaN(id)||id<0||id>=news.length){
    el.innerHTML='<div class="error"><h2>Article Not Found</h2><p>Please return to the news list and select an article</p></div>';
    return;
  }

  var a=news[id];
  document.title=e(a.title_cn||a.title)+' · CloudAbacus';

  var html='<article>';
  html+='<h1>'+e(a.title_cn||a.title)+'</h1>';
  html+='<div class="meta">';
  html+=a.lang==='zh'?'<span class="lang-tag zh">'+e(a.source)+'</span>':'<span class="lang-tag en">'+e(a.source)+'</span>';
  html+='<span>'+e(a.published||'')+'</span></div>';

  // Images
  if(a.images&&a.images.length){
    html+='<section><h2>Images</h2>';
    a.images.forEach(function(u){html+='<img src="'+e(u)+'" loading="lazy" onerror="this.style.display=\'none\'">'});
    html+='</section>';
  }

  // Main content
  var bodyText='';
  if(a.full_text_cn&&a.full_text_cn.length>50)bodyText=a.full_text_cn;
  else if(a.full_text&&a.full_text.length>50)bodyText=a.full_text;

  if(bodyText){
    html+='<section><h2>Content</h2>';
    bodyText.split('\n\n').forEach(function(p){if(p.trim())html+='<p>'+e(p.trim())+'</p>'});
    html+='</section>';
  }

  // English original (only when article is English AND has different full_text than displayed)
  if(a.lang==='en'&&a.full_text&&a.full_text.length>50&&a.full_text!==bodyText){
    html+='<section><h2>English Original</h2><div class="en-block">';
    a.full_text.split('\n\n').forEach(function(p){if(p.trim())html+='<p>'+e(p.trim())+'</p>'});
    html+='</div></section>';
  }

  // Read original button
  html+='<div class="source-box">';
  html+='<p style="color:var(--t2);font-size:.85rem;margin-bottom:.8rem;">Aggregated from <strong>'+e(a.source)+'</strong> via Google News</p>';
  html+='<a href="'+e(a.url)+'" target="_blank" rel="noopener" class="btn-read">Read Original Article &rarr;</a>';
  if(a.source_url)html+='<br><small style="color:var(--t2);display:inline-block;margin-top:.6rem;">Source site: '+e(a.source_url)+'</small>';
  html+='</div></article>';

  el.innerHTML=html;
})();
</script>
</body>
</html>
