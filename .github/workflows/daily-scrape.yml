name: 每日 GPU 价格抓取

on:
  schedule:
    # 每 4 小时运行一次 (UTC 0,4,8,12,16,20)
    - cron: '0 */4 * * *'
  # 允许手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install requests beautifulsoup4 playwright feedparser deep-translator trafilatura newspaper3k lxml
          playwright install --with-deps chromium

      - name: 运行价格爬虫
        run: |
          python fetch_prices.py --playwright --save-history
          echo "SCRAPE_TIME=$(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_ENV

      - name: 抓取新闻
        env:
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
        run: |
          python fetch_news.py || echo "新闻抓取失败"
          python fetch_futures.py || echo "期货新闻抓取失败"

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pricing_live.js
          git add price_history.js
          git add price_history.json
          git add news.js futures_news.js || true
          # 仅在有变更时提交
          if git diff --staged --quiet; then
            echo "没有新数据，跳过提交"
          else
            git commit -m "📊 每日价格更新 — ${{ env.SCRAPE_TIME }}"
            git push
            echo "✅ 已提交并推送"
          fi
