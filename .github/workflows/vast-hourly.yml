name: Vast.ai 每小时价格抓取

on:
  schedule:
    # 每小时运行一次 (UTC 每小时的第 5 分钟，避免整点高峰)
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install --with-deps chromium

      - name: 运行 Vast.ai 价格爬虫
        run: |
          python fetch_prices.py --vast-only --playwright --save-history
          echo "SCRAPE_TIME=$(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_ENV

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pricing_live.js
          git add price_history.js
          git add price_history.json
          if git diff --staged --quiet; then
            echo "没有新数据，跳过提交"
          else
            git commit -m "⚡ Vast.ai 每小时价格更新 — ${{ env.SCRAPE_TIME }}"
            git push
            echo "✅ 已提交并推送"
          fi
