<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="50%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c4b5fd"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Cloud shape: interconnected nodes -->
  <!-- Top row -->
  <circle cx="100" cy="28" r="10" fill="url(#g)"/>
  <line x1="50" y1="62" x2="100" y2="28" stroke="url(#g2)" stroke-width="1.5" opacity="0.5"/>
  <line x1="150" y1="62" x2="100" y2="28" stroke="url(#g2)" stroke-width="1.5" opacity="0.5"/>

  <!-- Middle row -->
  <circle cx="50" cy="62" r="14" fill="url(#g)"/>
  <circle cx="100" cy="55" r="12" fill="url(#g)" opacity="0.7"/>
  <circle cx="150" cy="62" r="14" fill="url(#g)"/>
  <line x1="50" y1="62" x2="100" y2="55" stroke="url(#g2)" stroke-width="1.5" opacity="0.5"/>
  <line x1="150" y1="62" x2="100" y2="55" stroke="url(#g2)" stroke-width="1.5" opacity="0.5"/>

  <!-- Bottom row of cloud -->
  <circle cx="28" cy="96" r="11" fill="url(#g)"/>
  <circle cx="78" cy="90" r="13" fill="url(#g)"/>
  <circle cx="122" cy="90" r="13" fill="url(#g)"/>
  <circle cx="172" cy="96" r="11" fill="url(#g)"/>

  <!-- Connecting lines for cloud bottom -->
  <line x1="28" y1="96" x2="78" y2="90" stroke="url(#g2)" stroke-width="1.5" opacity="0.5"/>
  <line x1="78" y1="90" x2="122" y2="90" stroke="url(#g2)" stroke-width="1.5" opacity="0.5"/>
  <line x1="122" y1="90" x2="172" y2="96" stroke="url(#g2)" stroke-width="1.5" opacity="0.5"/>
  <line x1="50" y1="62" x2="78" y2="90" stroke="url(#g2)" stroke-width="1.5" opacity="0.4"/>
  <line x1="150" y1="62" x2="122" y2="90" stroke="url(#g2)" stroke-width="1.5" opacity="0.4"/>

  <!-- Abacus: horizontal rails with beads -->
  <line x1="40" y1="125" x2="160" y2="125" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>
  <line x1="40" y1="145" x2="160" y2="145" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>
  <line x1="40" y1="165" x2="160" y2="165" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>

  <!-- Abacus beads on rail 1 -->
  <circle cx="55" cy="125" r="6" fill="url(#g)"/>
  <circle cx="78" cy="125" r="6" fill="url(#g)" opacity="0.7"/>
  <circle cx="100" cy="125" r="6" fill="url(#g)"/>
  <circle cx="122" cy="125" r="6" fill="url(#g)" opacity="0.7"/>
  <circle cx="145" cy="125" r="6" fill="url(#g)"/>

  <!-- Abacus beads on rail 2 -->
  <circle cx="45" cy="145" r="6" fill="url(#g)" opacity="0.7"/>
  <circle cx="67" cy="145" r="6" fill="url(#g)"/>
  <circle cx="100" cy="145" r="7" fill="url(#g)"/>
  <circle cx="133" cy="145" r="6" fill="url(#g)"/>
  <circle cx="155" cy="145" r="6" fill="url(#g)" opacity="0.7"/>

  <!-- Abacus beads on rail 3 -->
  <circle cx="55" cy="165" r="6" fill="url(#g)"/>
  <circle cx="78" cy="165" r="6" fill="url(#g)" opacity="0.7"/>
  <circle cx="100" cy="165" r="6" fill="url(#g)"/>
  <circle cx="122" cy="165" r="6" fill="url(#g)" opacity="0.7"/>
  <circle cx="145" cy="165" r="6" fill="url(#g)"/>
</svg>
