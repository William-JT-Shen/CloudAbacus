<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>运算盘 CloudAbacus</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a14;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    #bubblesCanvas { position: fixed; inset: 0; z-index: 0; }

    .hero { position: relative; z-index: 10; text-align: center; padding: 2rem; }

    .hero h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 900;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #c4b5fd 0%, #8b5cf6 40%, #6366f1 70%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.8rem;
      animation: titleGlow 3s ease-in-out infinite alternate;
    }
    @keyframes titleGlow {
      0% { filter: drop-shadow(0 0 20px rgba(139,92,246,0.3)); }
      100% { filter: drop-shadow(0 0 40px rgba(139,92,246,0.6)); }
    }

    .hero .subtitle {
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      color: #94a3b8;
      margin-bottom: 3rem;
      letter-spacing: 2px;
      font-weight: 300;
    }

    .hero .buttons { display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; }

    .hero .btn {
      display: inline-block; padding: 1rem 2.2rem; border-radius: 50px;
      font-size: 1.05rem; font-weight: 600; text-decoration: none;
      transition: all 0.3s ease; cursor: pointer; border: none;
      letter-spacing: 0.5px; position: relative; overflow: hidden;
    }

    .btn-primary {
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: white; box-shadow: 0 4px 25px rgba(139,92,246,0.35);
    }
    .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 8px 40px rgba(139,92,246,0.55); }

    .btn-secondary {
      background: rgba(139,92,246,0.12); color: #d8b4fe;
      border: 1.5px solid rgba(139,92,246,0.4);
    }
    .btn-secondary:hover {
      background: rgba(139,92,246,0.25); border-color: #a78bfa;
      transform: translateY(-3px); box-shadow: 0 8px 30px rgba(139,92,246,0.25);
    }

    .btn .icon { margin-right: 0.4rem; }

    .footer {
      position: fixed; bottom: 1.5rem; z-index: 10;
      color: #475569; font-size: 0.78rem; text-align: center; width: 100%;
    }
  </style>
</head>
<body>

<canvas id="bubblesCanvas"></canvas>

<div class="hero">
  <h1>运算盘 CloudAbacus</h1>
  <p class="subtitle">全球 GPU 算力平台看板 · 一站式查阅全球 GPU 租赁平台信息</p>
  <div class="buttons">
    <a href="platforms.html" class="btn btn-primary">
      <span class="icon">🌐</span> 全球云服务租赁平台
    </a>
    <a href="today_s_price.html" class="btn btn-secondary">
      <span class="icon">💰</span> 当日 GPU 租赁价格实时看盘
    </a>
  </div>
</div>

<div class="footer">运算盘 CloudAbacus · 数据每日自动更新</div>

<script>
(function() {
  var canvas = document.getElementById('bubblesCanvas');
  var ctx = canvas.getContext('2d');
  var bubbles = [];
  var BUBBLE_COUNT = 35;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  var colors = [
    'rgba(139,92,246,0.22)',
    'rgba(168,85,247,0.18)',
    'rgba(192,132,252,0.15)',
    'rgba(99,102,241,0.2)',
    'rgba(167,139,250,0.16)',
    'rgba(147,51,234,0.14)',
  ];

  for (var i = 0; i < BUBBLE_COUNT; i++) {
    bubbles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 100 + 40,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      color: colors[Math.floor(Math.random() * colors.length)],
      pulse: Math.random() * Math.PI * 2,
      pulseSpeed: Math.random() * 0.008 + 0.004,
    });
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (var i = 0; i < bubbles.length; i++) {
      var b = bubbles[i];
      b.pulse += b.pulseSpeed;
      var scale = 1 + Math.sin(b.pulse) * 0.06;
      b.x += b.vx;
      b.y += b.vy;
      if (b.x < -b.r) b.x = canvas.width + b.r;
      if (b.x > canvas.width + b.r) b.x = -b.r;
      if (b.y < -b.r) b.y = canvas.height + b.r;
      if (b.y > canvas.height + b.r) b.y = -b.r;

      // 纯柔光阴影 — 无实心泡泡，只有粉色光晕
      var r = b.r * scale;
      var grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, r);
      grad.addColorStop(0, b.color);
      grad.addColorStop(0.35, b.color);
      grad.addColorStop(1, 'rgba(0,0,0,0)');

      ctx.beginPath();
      ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
    }

    // 近距离连线
    for (var i = 0; i < bubbles.length; i++) {
      for (var j = i + 1; j < bubbles.length; j++) {
        var dx = bubbles[i].x - bubbles[j].x;
        var dy = bubbles[i].y - bubbles[j].y;
        var dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 180) {
          var alpha = (1 - dist/180) * 0.05;
          ctx.beginPath();
          ctx.moveTo(bubbles[i].x, bubbles[i].y);
          ctx.lineTo(bubbles[j].x, bubbles[j].y);
          ctx.strokeStyle = 'rgba(168,85,247,' + alpha + ')';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
    }

    requestAnimationFrame(draw);
  }

  draw();
})();
</script>

</body>
</html>
