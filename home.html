<script>
(function() {
  var canvas = document.getElementById('bubblesCanvas');
  var ctx = canvas.getContext('2d');
  var bubbles = [];
  var BUBBLE_COUNT = 35;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  var colors = [
    'rgba(139,92,246,0.22)',
    'rgba(168,85,247,0.18)',
    'rgba(192,132,252,0.15)',
    'rgba(99,102,241,0.2)',
    'rgba(167,139,250,0.16)',
    'rgba(147,51,234,0.14)',
  ];

  for (var i = 0; i < BUBBLE_COUNT; i++) {
    bubbles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 100 + 40,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      color: colors[Math.floor(Math.random() * colors.length)],
      pulse: Math.random() * Math.PI * 2,
      pulseSpeed: Math.random() * 0.008 + 0.004,
    });
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (var i = 0; i < bubbles.length; i++) {
      var b = bubbles[i];
      b.pulse += b.pulseSpeed;
      var scale = 1 + Math.sin(b.pulse) * 0.06;
      b.x += b.vx;
      b.y += b.vy;
      if (b.x < -b.r) b.x = canvas.width + b.r;
      if (b.x > canvas.width + b.r) b.x = -b.r;
      if (b.y < -b.r) b.y = canvas.height + b.r;
      if (b.y > canvas.height + b.r) b.y = -b.r;

      // 纯柔光阴影 — 无实心泡泡，只有粉色光晕
      var r = b.r * scale;
      var grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, r);
      grad.addColorStop(0, b.color);
      grad.addColorStop(0.35, b.color);
      grad.addColorStop(1, 'rgba(0,0,0,0)');

      ctx.beginPath();
      ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
    }

    // 近距离连线
    for (var i = 0; i < bubbles.length; i++) {
      for (var j = i + 1; j < bubbles.length; j++) {
        var dx = bubbles[i].x - bubbles[j].x;
        var dy = bubbles[i].y - bubbles[j].y;
        var dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 180) {
          var alpha = (1 - dist/180) * 0.05;
          ctx.beginPath();
          ctx.moveTo(bubbles[i].x, bubbles[i].y);
          ctx.lineTo(bubbles[j].x, bubbles[j].y);
          ctx.strokeStyle = 'rgba(168,85,247,' + alpha + ')';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
    }

    requestAnimationFrame(draw);
  }

  draw();
})();
</script>

<script>
// Logo animation with on-screen debug
(function(){
  var dbgEl=document.getElementById('dbg');
  function log(m){ if(dbgEl)dbgEl.textContent=(dbgEl.textContent+m).slice(-300); console.log(m); }

  var svg=document.getElementById('logo');
  if(!svg){ log('NO SVG'); return; }

  var graph={
    n0:['n1','n2','n3'], n1:['n0','n2','n5'], n2:['n0','n1','n3'],
    n3:['n0','n2','n6'], n4:['n5'], n5:['n1','n4','n6'],
    n6:['n3','n5','n7'], n7:['n6']
  };
  var coords={ n0:[100,28],n1:[50,62],n2:[100,55],n3:[150,62], n4:[28,96],n5:[78,90],n6:[122,90],n7:[172,96] };

  function halo(id,on){
    var h=document.getElementById('h'+id.slice(1));
    if(h){ if(on)h.classList.add('on'); else h.classList.remove('on'); }
  }

  // Precompute edges
  var edges={};
  Object.keys(graph).forEach(function(a){
    graph[a].forEach(function(b){
      var k=[a,b].sort().join('-');
      if(edges[k])return;
      var ca=coords[a],cb=coords[b];
      var L=Math.sqrt((cb[0]-ca[0])**2+(cb[1]-ca[1])**2);
      var gid='g'+k.replace(/n/g,'').replace(/-/g,'');
      edges[k]={len:L, gid:gid};
      var gel=document.getElementById(gid);
      if(gel){ gel.setAttribute('stroke-dasharray',Math.round(L)); gel.setAttribute('stroke-dashoffset',Math.round(L)); }
    });
  });
  log('edges:'+Object.keys(edges).length);

  var prev=null, cur=null;

  function jump(from){
    var nb=graph[from]||[];
    var cand=nb.filter(function(n){return n!==prev;});
    if(!cand.length) cand=nb;
    if(!cand.length) cand=Object.keys(graph).filter(function(n){return n!==from;});
    var to=cand[Math.floor(Math.random()*cand.length)];
    log(from+'->'+to);
    prev=from; cur=to;
    glowEdge(from,to);
  }

  function glowEdge(from,to){
    var k=[from,to].sort().join('-');
    var e=edges[k]; if(!e){ log('NOEDGE '+k); return; }
    var gel=document.getElementById(e.gid); if(!gel){ log('NOEL '+e.gid); return; }

    // Set direction
    var fc=coords[from],tc=coords[to];
    gel.setAttribute('x1',fc[0]); gel.setAttribute('y1',fc[1]);
    gel.setAttribute('x2',tc[0]); gel.setAttribute('y2',tc[1]);
    gel.setAttribute('stroke-dasharray',Math.round(e.len));
    gel.setAttribute('stroke-dashoffset',Math.round(e.len));
    gel.classList.add('active');
    log('edge:'+e.gid+' len='+Math.round(e.len));

    // Animate dash with setInterval (60 steps over 3s)
    var steps=60, i=0, iv=setInterval(function(){
      i++; var t=i/steps;
      var v=Math.round(e.len*(1 - (t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2)));
      gel.setAttribute('stroke-dashoffset',v);
      if(i>=steps){ clearInterval(iv);
        // Edge reached target - light node
        halo(to,true);
        log('lit:'+to);

        // Fade edge out (30 steps over 1.5s)
        var j=0, iv2=setInterval(function(){
          j++; var t2=j/30;
          gel.setAttribute('stroke-dashoffset',Math.round(-e.len*(t2<.5?2*t2*t2:1-Math.pow(-2*t2+2,2)/2)));
          if(j>=30){ clearInterval(iv2); gel.classList.remove('active');
            gel.setAttribute('stroke-dashoffset',Math.round(e.len));
          }
        },50);

        // After 3s on node, next jump
        setTimeout(function(){ halo(to,false); jump(to); },3000);
      }
    },50);
  }

  // Start
  var all=Object.keys(graph);
  var s=all[Math.floor(Math.random()*all.length)];
  cur=s; halo(s,true); log('START:'+s);
  setTimeout(function(){ halo(s,false); jump(s); },3000);
})();
</script>
