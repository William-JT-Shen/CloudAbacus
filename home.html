<script>
(function() {
  var canvas = document.getElementById('bubblesCanvas');
  var ctx = canvas.getContext('2d');
  var bubbles = [];
  var BUBBLE_COUNT = 35;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  var colors = [
    'rgba(139,92,246,0.22)',
    'rgba(168,85,247,0.18)',
    'rgba(192,132,252,0.15)',
    'rgba(99,102,241,0.2)',
    'rgba(167,139,250,0.16)',
    'rgba(147,51,234,0.14)',
  ];

  for (var i = 0; i < BUBBLE_COUNT; i++) {
    bubbles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 100 + 40,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      color: colors[Math.floor(Math.random() * colors.length)],
      pulse: Math.random() * Math.PI * 2,
      pulseSpeed: Math.random() * 0.008 + 0.004,
    });
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (var i = 0; i < bubbles.length; i++) {
      var b = bubbles[i];
      b.pulse += b.pulseSpeed;
      var scale = 1 + Math.sin(b.pulse) * 0.06;
      b.x += b.vx;
      b.y += b.vy;
      if (b.x < -b.r) b.x = canvas.width + b.r;
      if (b.x > canvas.width + b.r) b.x = -b.r;
      if (b.y < -b.r) b.y = canvas.height + b.r;
      if (b.y > canvas.height + b.r) b.y = -b.r;

      // 纯柔光阴影 — 无实心泡泡，只有粉色光晕
      var r = b.r * scale;
      var grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, r);
      grad.addColorStop(0, b.color);
      grad.addColorStop(0.35, b.color);
      grad.addColorStop(1, 'rgba(0,0,0,0)');

      ctx.beginPath();
      ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
    }

    // 近距离连线
    for (var i = 0; i < bubbles.length; i++) {
      for (var j = i + 1; j < bubbles.length; j++) {
        var dx = bubbles[i].x - bubbles[j].x;
        var dy = bubbles[i].y - bubbles[j].y;
        var dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 180) {
          var alpha = (1 - dist/180) * 0.05;
          ctx.beginPath();
          ctx.moveTo(bubbles[i].x, bubbles[i].y);
          ctx.lineTo(bubbles[j].x, bubbles[j].y);
          ctx.strokeStyle = 'rgba(168,85,247,' + alpha + ')';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
    }

    requestAnimationFrame(draw);
  }

  draw();
})();
</script>

<script>
// Logo jumping glow animation
(function(){
  var svg = document.getElementById('logo');
  if(!svg) return;

  // Adjacency graph: node_id -> [neighbor_ids]
  var graph = {
    n0: ['n1','n2','n3'],
    n1: ['n0','n2','n5'],
    n2: ['n0','n1','n3'],
    n3: ['n0','n2','n6'],
    n4: ['n5'],
    n5: ['n1','n4','n6'],
    n6: ['n3','n5','n7'],
    n7: ['n6']
  };

  // Edge IDs connecting node pairs (sorted for lookup)
  var edgeMap = {
    'n0-n1':'l01','n0-n2':'l02','n0-n3':'l03',
    'n1-n2':'l12','n2-n3':'l23',
    'n1-n5':'l15','n3-n6':'l36',
    'n4-n5':'l45','n5-n6':'l56','n6-n7':'l67'
  };

  function edgeId(a,b) {
    var key = [a,b].sort().join('-');
    return edgeMap[key] || null;
  }

  var currentNode = null;
  var glowTimer = null;

  function clearGlow() {
    if(currentNode) {
      svg.getElementById(currentNode).classList.remove('lit');
      // Clear adjacent edges
      var neighbors = graph[currentNode] || [];
      neighbors.forEach(function(nb) {
        var eid = edgeId(currentNode, nb);
        if(eid) svg.getElementById(eid).classList.remove('lit');
      });
    }
  }

  function setGlow(nodeId) {
    svg.getElementById(nodeId).classList.add('lit');
    // Light up adjacent edges
    var neighbors = graph[nodeId] || [];
    neighbors.forEach(function(nb) {
      var eid = edgeId(nodeId, nb);
      if(eid) svg.getElementById(eid).classList.add('lit');
    });
  }

  function jump() {
    var neighbors;
    if(currentNode) {
      neighbors = graph[currentNode] || [];
    } else {
      // First jump: pick any node
      neighbors = Object.keys(graph);
    }

    var next;
    if(neighbors.length > 0) {
      next = neighbors[Math.floor(Math.random() * neighbors.length)];
    } else {
      next = Object.keys(graph)[Math.floor(Math.random() * Object.keys(graph).length)];
    }

    clearGlow();
    currentNode = next;
    setGlow(currentNode);

    // Next jump in 600-1200ms
    var delay = 600 + Math.random() * 600;
    glowTimer = setTimeout(jump, delay);
  }

  // Start
  jump();
})();
</script>
