<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPU 算力租赁资讯 · 云算盘</title>
  <style>
    :root{--bg:#0a0a14;--card:#141428;--text:#e2e8f0;--t2:#94a3b8;--border:#2d2d50;--accent:#06b6d4;--r:12px;--rs:8px}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
    body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 80% 50% at 20% 10%,rgba(6,182,212,.1) 0%,transparent 60%),radial-gradient(ellipse 60% 60% at 80% 80%,rgba(34,211,238,.06) 0%,transparent 60%)}
    .container{max-width:900px;margin:0 auto;padding:1.5rem;position:relative;z-index:1}
    .header{display:flex;align-items:center;gap:.75rem;margin-bottom:1.5rem;flex-wrap:wrap}
    .header h1{font-size:1.6rem;color:var(--text)}
    .btn-back{display:inline-flex;align-items:center;gap:.3rem;padding:.45rem .85rem;border-radius:var(--rs);text-decoration:none;font-size:.82rem;background:rgba(6,182,212,.1);border:1px solid rgba(6,182,212,.25);color:#67e8f9;transition:all .2s}
    .btn-back:hover{background:rgba(6,182,212,.2)}
    .badge{font-size:.78rem;color:#34d399;background:rgba(16,185,129,.1);padding:.3rem .7rem;border-radius:20px;border:1px solid rgba(16,185,129,.2)}

    .news-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.2rem;margin-bottom:.75rem;box-shadow:0 4px 20px rgba(0,0,0,.2);transition:all .2s;text-decoration:none;display:flex;gap:.85rem;align-items:flex-start;color:inherit;position:relative}
    .news-card:hover{border-color:var(--accent);box-shadow:0 4px 25px rgba(6,182,212,.15);transform:translateY(-1px)}
    .nc-favicon{flex-shrink:0;width:36px;height:36px;border-radius:6px;background:rgba(6,182,212,.1);display:flex;align-items:center;justify-content:center;overflow:hidden}
    .nc-favicon img{width:20px;height:20px;object-fit:contain}
    .nc-favicon .fallback{font-size:.75rem;font-weight:700;color:#06b6d4}
    .nc-body{flex:1;min-width:0}
    .nc-title{font-size:.98rem;font-weight:700;color:var(--text);margin-bottom:.25rem;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .nc-meta{font-size:.72rem;color:var(--t2);display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
    .nc-lang{padding:.1rem .4rem;border-radius:4px;font-size:.62rem;font-weight:600}
    .nc-lang.zh{background:rgba(16,185,129,.12);color:#34d399}
    .nc-lang.en{background:rgba(245,158,11,.12);color:#fbbf24}
    .nc-source-tag{color:var(--t2);font-weight:500}
    .nc-external{position:absolute;top:.6rem;right:.75rem;font-size:.7rem;color:var(--t2);opacity:.5}
    .news-card:hover .nc-external{opacity:1;color:var(--accent)}

    .no-data{text-align:center;padding:3rem;color:var(--t2)}
    .footer{text-align:center;padding:2rem 0 1rem;font-size:.78rem;color:#475569}
    @media(max-width:768px){.container{padding:.75rem}.nc-title{font-size:.9rem}}
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <a href="home.html" class="btn-back">← 返回首页</a>
    <h1>📰 GPU 算力租赁资讯</h1>
    <span class="badge" id="badge">加载中...</span>
  </div>
  <div style="background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.18);border-radius:8px;padding:.5rem 1rem;margin-bottom:1rem;font-size:.75rem;color:#fbbf24;text-align:center">⚠ 下述文章点击后将跳转至 Google News 源站，在中国大陆境内可能需要科学上网才能访问</div>
  <div id="list"></div>
  <div class="no-data" id="noData" style="display:none">暂无新闻数据</div>
  <div class="footer">云算盘 CloudAbacus · 点击卡片直接跳转原文 · 数据每日自动更新</div>
</div>

<script src="news.js"></script>
<script>
(function(){
  var news=window.GPU_NEWS||[],t=window.NEWS_FETCHED_AT||'';
  var list=document.getElementById('list'),no=document.getElementById('noData'),badge=document.getElementById('badge');
  badge.textContent=t?'🟢 更新于 '+t.replace('T',' ').slice(0,16):'🟡 暂无';
  if(!news.length){no.style.display='block';return}

  function e(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function domain(u){try{return new URL(u).hostname.replace('www.','')}catch(e){return''}}

  news.forEach(function(a){
    var langTag=a.lang==='zh'?'<span class="nc-lang zh">中</span>':'<span class="nc-lang en">EN</span>';
    var srcDomain=domain(a.source_url||'');
    var faviconHtml='';
    if(srcDomain){
      faviconHtml='<img src="https://icons.duckduckgo.com/ip3/'+e(srcDomain)+'.ico" loading="lazy" onerror="this.parentElement.innerHTML=\'<span class=fallback>'+e((a.source||'?')[0])+'</span>\'">';
    } else {
      faviconHtml='<span class="fallback">'+e((a.source||'?')[0])+'</span>';
    }

    var displayTitle=a.title_cn||a.title;
    var displayDate=a.published||'';

    var card='<a href="'+e(a.url)+'" target="_blank" rel="noopener" class="news-card">'+
      '<div class="nc-favicon">'+faviconHtml+'</div>'+
      '<div class="nc-body">'+
        '<div class="nc-title">'+e(displayTitle)+'</div>'+
        '<div class="nc-meta">'+
          langTag+
          '<span class="nc-source-tag">'+e(a.source)+'</span>'+
          '<span>'+e(displayDate)+'</span>'+
        '</div>'+
      '</div>'+
      '<span class="nc-external">↗</span>'+
    '</a>';
    list.innerHTML+=card;
  });
})();
</script>
</body>
</html>
