<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPU 算力资讯 · 运算盘</title>
  <style>
    :root {
      --bg:#0a0a14;--card:#141428;--text:#e2e8f0;--t2:#94a3b8;
      --border:#2d2d50;--accent:#8b5cf6;--r:12px;--rs:8px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
    body::before{
      content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
      background:radial-gradient(ellipse 80% 50% at 20% 10%,rgba(139,92,246,.1) 0%,transparent 60%),radial-gradient(ellipse 60% 60% at 80% 80%,rgba(99,102,241,.08) 0%,transparent 60%);
    }
    .container{max-width:900px;margin:0 auto;padding:1.5rem;position:relative;z-index:1}
    .header{display:flex;align-items:center;gap:.75rem;margin-bottom:1.5rem;flex-wrap:wrap}
    .header h1{font-size:1.6rem;color:var(--text)}
    .btn-back{display:inline-flex;align-items:center;gap:.3rem;padding:.45rem .85rem;border-radius:var(--rs);text-decoration:none;font-size:.82rem;background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.3);color:#b4a5f7;transition:all .2s}
    .btn-back:hover{background:rgba(139,92,246,.25)}
    .badge{font-size:.78rem;color:#34d399;background:rgba(16,185,129,.1);padding:.3rem .7rem;border-radius:20px;border:1px solid rgba(16,185,129,.2)}

    .news-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1.2rem 1.4rem;margin-bottom:.9rem;box-shadow:0 4px 20px rgba(0,0,0,.2);transition:all .2s;cursor:pointer}
    .news-card:hover{border-color:var(--accent);box-shadow:0 4px 25px rgba(139,92,246,.1)}
    .nc-title{font-size:1.05rem;font-weight:700;color:var(--text);margin-bottom:.3rem;line-height:1.4}
    .nc-meta{font-size:.75rem;color:var(--t2);margin-bottom:.4rem;display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}
    .nc-summary{font-size:.85rem;color:var(--t2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .nc-lang{padding:.1rem .4rem;border-radius:4px;font-size:.65rem}
    .nc-lang.zh{background:rgba(16,185,129,.15);color:#34d399}
    .nc-lang.en{background:rgba(245,158,11,.15);color:#fbbf24}
    .nc-imgs{display:flex;gap:.5rem;margin-top:.5rem;flex-wrap:wrap}
    .nc-imgs img{max-height:120px;border-radius:6px;border:1px solid var(--border)}

    /* Detail Modal */
    .modal-overlay{display:none;position:fixed;inset:0;z-index:2000;background:rgba(10,10,20,.8);backdrop-filter:blur(4px);justify-content:center;align-items:flex-start;padding:2rem 1rem;overflow-y:auto}
    .modal-overlay.show{display:flex}
    .modal-dialog{background:var(--card);border:1px solid var(--border);border-radius:var(--r);width:100%;max-width:800px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:mi .25s ease}
    @keyframes mi{from{opacity:0;transform:translateY(-20px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
    .modal-hd{display:flex;justify-content:space-between;align-items:flex-start;padding:1.2rem 1.5rem;border-bottom:1px solid var(--border);gap:1rem}
    .modal-hd h2{font-size:1.2rem;color:var(--text);line-height:1.4}
    .modal-close{background:none;border:none;font-size:1.3rem;cursor:pointer;color:#64748b;padding:.2rem .5rem;border-radius:6px}
    .modal-close:hover{background:rgba(139,92,246,.2);color:#e2e8f0}
    .modal-body{padding:1.2rem 1.5rem;max-height:65vh;overflow-y:auto}
    .modal-body h3{color:#c4b5fd;font-size:.95rem;margin:1rem 0 .5rem}
    .modal-body p{color:var(--t2);font-size:.88rem;line-height:1.8;margin-bottom:.8rem}
    .modal-body .en-original{background:rgba(255,255,255,.02);border-left:2px solid rgba(139,92,246,.3);border-radius:0 6px 6px 0;padding:.8rem 1rem;margin:1rem 0;font-size:.84rem;color:#94a3b8;line-height:1.7}
    .modal-body img{max-width:100%;border-radius:8px;margin:.5rem 0;border:1px solid var(--border)}
    .modal-src{margin-top:1rem;font-size:.8rem;color:var(--accent)}
    .modal-src a{color:var(--accent);text-decoration:none}
    .modal-src a:hover{text-decoration:underline}

    .no-data{text-align:center;padding:3rem;color:var(--t2)}
    .footer{text-align:center;padding:2rem 0 1rem;font-size:.78rem;color:#475569}

    @media(max-width:768px){.container{padding:.75rem}.modal-dialog{margin:1rem}}
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <a href="home.html" class="btn-back">← 返回首页</a>
    <h1>📰 GPU 算力资讯</h1>
    <span class="badge" id="badge">加载中...</span>
  </div>
  <div id="list"></div>
  <div class="no-data" id="noData" style="display:none">暂无新闻数据</div>
  <div class="footer">运算盘 CloudAbacus · 新闻自动更新 · Google News</div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal-dialog">
    <div class="modal-hd">
      <h2 id="mTitle"></h2>
      <button class="modal-close" id="mClose">✕</button>
    </div>
    <div class="modal-body" id="mBody"></div>
  </div>
</div>

<script src="news.js"></script>
<script>
(function(){
  var news=window.GPU_NEWS||[],t=window.NEWS_FETCHED_AT||'';
  var list=document.getElementById('list'),no=document.getElementById('noData'),badge=document.getElementById('badge');
  var modal=document.getElementById('modal'),mTitle=document.getElementById('mTitle'),mBody=document.getElementById('mBody');

  badge.textContent=t?'🟢 更新于 '+t.replace('T',' ').slice(0,16):'🟡 暂无';
  if(!news.length){no.style.display='block';return}

  function e(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

  news.forEach(function(a,i){
    var lt=a.lang==='zh'?'<span class="nc-lang zh">中文</span>':'<span class="nc-lang en">English</span>';
    var imgs='';
    if(a.images&&a.images.length){
      imgs='<div class="nc-imgs">'+a.images.map(function(u){return'<img src="'+e(u)+'" loading="lazy" onerror="this.style.display=\'none\'">'}).join('')+'</div>';
    }
    var card='<div class="news-card" data-idx="'+i+'">'+
      '<div class="nc-title">'+e(a.title_cn||a.title)+'</div>'+
      '<div class="nc-meta">'+lt+' <span>'+e(a.source)+'</span> <span>'+e(a.published||'')+'</span></div>'+
      '<div class="nc-summary">'+e(a.summary_cn||a.summary)+'</div>'+imgs+'</div>';
    list.innerHTML+=card;
  });

  // Click card → open detail
  list.addEventListener('click',function(ev){
    var card=ev.target.closest('.news-card');
    if(!card)return;
    var i=parseInt(card.dataset.idx),a=news[i];
    if(!a)return;
    openDetail(a);
  });

  function openDetail(a){
    mTitle.textContent=a.title_cn||a.title;
    var html='';

    // Main text (Chinese)
    var txt=a.full_text_cn||a.summary_cn||a.full_text||a.summary||'';
    if(txt){
      html+='<h3>📖 中文翻译</h3>';
      txt.split('\n\n').forEach(function(p){if(p.trim())html+='<p>'+e(p.trim())+'</p>'});
    }

    // Images
    if(a.images&&a.images.length){
      html+='<h3>🖼️ 配图</h3>';
      a.images.forEach(function(u){html+='<img src="'+e(u)+'" loading="lazy" onerror="this.style.display=\'none\'">'});
    }

    // English original
    if(a.lang==='en'&&a.full_text){
      html+='<h3>🇬🇧 英文原文</h3><div class="en-original">';
      a.full_text.split('\n\n').forEach(function(p){if(p.trim())html+='<p>'+e(p.trim())+'</p>'});
      html+='</div>';
    }else if(a.lang==='en'&&a.summary){
      html+='<h3>🇬🇧 英文原文</h3><div class="en-original"><p>'+e(a.summary)+'</p></div>';
    }

    // Source
    html+='<div class="modal-src">🔗 来源：<a href="'+e(a.url)+'" target="_blank" rel="noopener">'+e(a.url)+'</a></div>';
    mBody.innerHTML=html;
    modal.classList.add('show');
    document.body.style.overflow='hidden';
  }

  document.getElementById('mClose').addEventListener('click',function(){modal.classList.remove('show');document.body.style.overflow=''});
  modal.addEventListener('click',function(e){if(e.target===modal){modal.classList.remove('show');document.body.style.overflow=''}});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){modal.classList.remove('show');document.body.style.overflow=''}});
})();
</script>
</body>
</html>
